[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aviation-tracker"
version = "0.1.0"
description = "Курсовой проект: трекер самолётов через OpenSky API с загрузкой в PostgreSQL"
authors = ["Semen <prudnikov.s.s@yandex.ru>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"
psycopg2-binary = "^2.9.10"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
isort = "^5.13.2"
mypy = "^1.13.0"
black = "^24.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"

[tool.black]
line-length = 119
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
known_first_party = "src"
skip_glob = ["tests/*", "venv/*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
exclude = ["^tests/", "^venv/"]

[tool.flake8]
max-line-length = 119
exclude = ["git", "__pycache__", "tests/", "venv/", "build/", ".env/", "Lib/site-packages"]
ignore = ["E203", "W503"]
extend-select = ["B,C,E,F,W,T4,B9"]
per-file-ignores = "__init__.py:F401"

[tool.coverage.run]
source = ["src"]
omit = ["main.py", "src/*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-report=html"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
